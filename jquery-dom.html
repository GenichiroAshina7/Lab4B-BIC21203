<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 4b - Question 3: jQuery Integration</title>
  <style>
    .myStyle {
      background-color: coral;
      padding: 16px;
    }
  </style>
  <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
</head>
<body>

  <div id="myElement">Original Text</div>
  <div id="myDIV"><p>I am a myDIV.</p></div>
  <button id="myButton">Click me</button>

  <script>
    $(document).ready(function() {
      // (a) Equivalent of document.getElementById("myElement").textContent = "Modified Text";
      $("#myElement").text("Modified Text");

      // (b) Equivalent of document.querySelector("#myDIV").classList.add("myStyle");
      $("#myDIV").addClass("myStyle");

      // (c) Equivalent of document.getElementById("myButton").addEventListener("click", ...);
      $("#myButton").on("click", function() {
        alert("Button clicked!");
      });
    });
  </script>

</body>
</html>
